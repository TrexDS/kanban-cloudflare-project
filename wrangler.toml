name = "my-kanban"
pages_build_output_dir = "public"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# Kanban docs live in D1 (table `docs`, see migrations/). The old KV namespace
# 38fe44db… is no longer bound: it stays as the frozen pre-migration copy for rollback.
[[d1_databases]]
binding = "DB"
database_name = "mori-kanban"
database_id = "5a766285-37de-4ad2-b3fb-9ec9d0b0f1e9"
migrations_dir = "migrations"

# Preview deployments use an isolated database (copied from the preview KV), never production data.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "mori-kanban-preview"
database_id = "675f15e1-f3f8-4a55-b6d0-cae0c97c9fb3"
migrations_dir = "migrations"
