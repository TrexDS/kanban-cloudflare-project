<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多线程任务看板</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#2b2b2b; --sub:#8a8578;
    --active:#3d6b5c; --active-bg:#e8f2ee;
    --watch:#a3742f; --watch-bg:#faf1e2;
    --archived:#8a8578; --archived-bg:#efefec;
    --accent:#c1573f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:80px;
  }
  header{
    padding:20px 16px 0; position:sticky; top:0; background:var(--bg); z-index:10;
    border-bottom:1px solid #e5e2da;
  }
  h1{font-size:19px; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:13px; margin:0;}
  .toolbar{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  button{
    font-family:inherit; border:none; border-radius:10px; padding:9px 14px;
    font-size:13.5px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{background:var(--accent); color:#fff; font-weight:600;}
  .btn-ghost{background:#fff; color:var(--ink); border:1px solid #ddd8cc;}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .tabs{display:flex; gap:0; margin-top:14px; overflow-x:auto;}
  .tab{
    flex:1; text-align:center; padding:10px 4px; font-size:12.5px; font-weight:600;
    color:var(--sub); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .tab.on{color:var(--ink); border-bottom-color:var(--accent);}
  main{padding:14px 16px;}
  .view{display:none;}
  .view.on{display:block;}
  .col{margin-bottom:22px;}
  .col-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.active{background:var(--active);}
  .dot.watch{background:var(--watch);}
  .dot.archived{background:var(--archived);}
  .col-title{font-weight:700; font-size:14.5px;}
  .col-count{color:var(--sub); font-size:12.5px;}
  .card{
    background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05); border-left:4px solid transparent;
  }
  .card.active{border-left-color:var(--active);}
  .card.watch{border-left-color:var(--watch);}
  .card.archived{border-left-color:var(--archived); opacity:0.6;}
  .card-title{font-weight:600; font-size:15px; margin:0 0 4px;}
  .card-notes{font-size:13px; color:#555; margin:0 0 6px; white-space:pre-wrap;}
  .card-meta{font-size:11.5px; color:var(--sub); margin-bottom:8px;}
  .card-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .chip{
    font-size:12px; padding:5px 10px; border-radius:20px; border:1px solid #e0dccf;
    background:#fbfaf7; color:var(--ink);
  }
  .chip.danger{color:var(--accent); border-color:#f0d6cd;}
  .chip.hours{background:var(--active-bg); color:var(--active); border-color:transparent; font-weight:600;}
  .empty{color:var(--sub); font-size:13px; padding:6px 2px;}
  .stage-badge{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px;
    font-weight:600; margin-bottom:6px;
  }
  .stage-applied{background:#eef1ea; color:#5c6b4a;}
  .stage-screen{background:#e8f0f7; color:#3a5f7d;}
  .stage-interview{background:#faf1e2; color:#a3742f;}
  .stage-final{background:#f3e8f5; color:#7a4a85;}
  .stage-offer{background:#e8f2ee; color:#3d6b5c;}
  .stage-rejected{background:#efefec; color:#8a8578;}
  .stage-contacted{background:#eef1ea; color:#5c6b4a;}
  .stage-replied{background:#e8f0f7; color:#3a5f7d;}
  .stage-meeting{background:#e8f2ee; color:#3d6b5c;}
  .stage-noresponse{background:#efefec; color:#8a8578;}
  select.stage-select{
    font-size:12.5px; padding:6px 8px; border-radius:8px; border:1px solid #e0dccf;
    font-family:inherit; background:#fbfaf7;
  }
  .pipeline-section-title, .dash-section-title{font-weight:700; font-size:14.5px; margin:18px 0 8px;}
  .add-form{display:none; background:#fff; border-radius:14px; padding:14px; margin-bottom:16px; border:1px solid #e5e2da;}
  .add-form.show{display:block;}
  .add-form input, .add-form textarea, .add-form select{
    width:100%; border:1px solid #e0dccf; border-radius:10px; padding:9px 10px;
    font-family:inherit; font-size:13.5px; margin-bottom:8px;
  }
  /* Daily log */
  .log-row{
    background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  .log-row-title{font-weight:600; font-size:14.5px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .log-today-total{font-size:12.5px; color:var(--active); font-weight:700;}
  .log-btns{display:flex; gap:6px; flex-wrap:wrap;}
  textarea.daily-note{
    width:100%; min-height:60px; border:1px solid #e0dccf; border-radius:10px;
    padding:10px; font-family:inherit; font-size:13.5px; resize:vertical; margin-top:6px;
  }
  /* Dashboard */
  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
  .bar-track{background:#efefec; border-radius:8px; height:10px; overflow:hidden;}
  .bar-fill{background:var(--active); height:100%; border-radius:8px;}
  .progress-card{background:#fff; border-radius:14px; padding:14px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  .progress-track{background:#efefec; border-radius:10px; height:14px; overflow:hidden; margin:8px 0;}
  .progress-fill{background:var(--accent); height:100%; border-radius:10px;}
  .stale-item{
    background:#fff; border-radius:12px; padding:10px 14px; margin-bottom:8px;
    border-left:4px solid var(--watch); font-size:13px;
  }
  .streak-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #efefec; font-size:13.5px;}
  .streak-row:last-child{border-bottom:none;}
  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,28,22,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px 18px 26px; animation:up .18s ease-out; max-height:85vh; overflow-y:auto;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{font-size:15px; margin:0 0 2px;}
  .sheet .progress{font-size:12px; color:var(--sub); margin-bottom:14px;}
  .sheet .title{font-size:17px; font-weight:700; margin:0 0 8px;}
  .sheet textarea{
    width:100%; min-height:70px; border:1px solid #e0dccf; border-radius:10px;
    padding:10px; font-family:inherit; font-size:13.5px; resize:vertical; margin-bottom:14px;
  }
  .sheet-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .sheet-actions button{width:100%; padding:12px 8px; font-size:13.5px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#2b2b2b; color:#fff; padding:9px 18px; border-radius:20px;
    font-size:13px; opacity:0; transition:opacity .25s; z-index:200; pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>🗂️ 多线程任务看板</h1>
  <p class="sub" id="lastCheckin">加载中…</p>
  <div class="tabs">
    <div class="tab on" id="tab-kanban" onclick="switchTab('kanban')">宏观看板</div>
    <div class="tab" id="tab-pipeline" onclick="switchTab('pipeline')">求职明细</div>
    <div class="tab" id="tab-daily" onclick="switchTab('daily')">今日打卡</div>
    <div class="tab" id="tab-dash" onclick="switchTab('dash')">Dashboard</div>
  </div>
</header>

<main>
  <!-- KANBAN VIEW -->
  <div class="view on" id="view-kanban">
    <div class="toolbar" style="margin:14px 0;">
      <button class="btn-primary" onclick="startCheckin()">开始每周确认</button>
      <button class="btn-ghost" onclick="toggleAddForm()">+ 新增线程</button>
    </div>
    <div class="add-form" id="addForm">
      <div id="addFormTitle" style="font-weight:700; font-size:13.5px; margin-bottom:8px;">新增线程</div>
      <input type="text" id="newTitle" placeholder="线程名称，例如：面签复审">
      <textarea id="newNotes" placeholder="备注（可选）"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" onclick="addTask()">保存</button>
        <button class="btn-ghost" onclick="toggleAddForm()">取消</button>
      </div>
    </div>
    <div class="col">
      <div class="col-head"><span class="dot active"></span><span class="col-title">推进中</span><span class="col-count" id="count-active"></span></div>
      <div id="list-active"></div>
    </div>
    <div class="col">
      <div class="col-head"><span class="dot watch"></span><span class="col-title">搁置 / 观望</span><span class="col-count" id="count-watch"></span></div>
      <div id="list-watch"></div>
    </div>
    <div class="col">
      <div class="col-head"><span class="dot archived"></span><span class="col-title">已归档</span><span class="col-count" id="count-archived"></span></div>
      <div id="list-archived"></div>
    </div>
  </div>

  <!-- PIPELINE VIEW -->
  <div class="view" id="view-pipeline">
    <p class="sub" style="margin:14px 0 0;">这里是随时更新的执行细节，不进每周确认流程。</p>
    <div class="pipeline-section-title">📋 公司 / 面试进度</div>
    <div class="toolbar" style="margin-bottom:10px;">
      <button class="btn-ghost" onclick="toggleForm('companyForm')">+ 新增公司</button>
    </div>
    <div class="add-form" id="companyForm">
      <input type="text" id="coName" placeholder="公司名称">
      <select id="coStage">
        <option value="applied">已投递</option>
        <option value="screen">初筛/电话面</option>
        <option value="interview">面试中</option>
        <option value="final">终面</option>
        <option value="offer">Offer</option>
        <option value="rejected">已拒 / 结束</option>
      </select>
      <textarea id="coNotes" placeholder="备注，例如下一步动作/截止日期"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" onclick="addCompany()">保存</button>
        <button class="btn-ghost" onclick="toggleForm('companyForm')">取消</button>
      </div>
    </div>
    <div id="list-companies"></div>

    <div class="pipeline-section-title">🤝 Cold Outreach / 人脉联系</div>
    <div class="toolbar" style="margin-bottom:10px;">
      <button class="btn-ghost" onclick="toggleForm('contactForm')">+ 新增联系人</button>
    </div>
    <div class="add-form" id="contactForm">
      <input type="text" id="ctName" placeholder="姓名 / 公司 / 职位">
      <select id="ctStage">
        <option value="contacted">已发送消息</option>
        <option value="replied">已回复</option>
        <option value="meeting">已约见 / 通话</option>
        <option value="noresponse">无回应</option>
      </select>
      <textarea id="ctNotes" placeholder="备注"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" onclick="addContact()">保存</button>
        <button class="btn-ghost" onclick="toggleForm('contactForm')">取消</button>
      </div>
    </div>
    <div id="list-contacts"></div>
  </div>

  <!-- DAILY LOG VIEW -->
  <div class="view" id="view-daily">
    <p class="sub" style="margin:14px 0 0;" id="dailyDateLabel"></p>
    <p class="sub" style="margin:2px 0 14px;">点一下记录今天在这条线程上花的时间，晚上顺手打个卡就行。</p>
    <div id="list-dailylog"></div>
    <div class="dash-section-title">📝 今日备注</div>
    <textarea class="daily-note" id="dailyNoteInput" placeholder="今天大概做了什么（可选）" onblur="saveDailyNote()"></textarea>
  </div>

  <!-- DASHBOARD VIEW -->
  <div class="view" id="view-dash">
    <div class="progress-card" id="farewellProgressCard"></div>
    <div class="dash-section-title">💍 健康总览（Oura）</div>
    <div class="progress-card" id="ouraOverviewCard">加载中…</div>
    <div class="dash-section-title">📈 关键趋势（HRV / 静息心率）</div>
    <div class="progress-card" id="ouraTrendCard">加载中…</div>
    <div class="dash-section-title">🏃 今日活动</div>
    <div class="progress-card" id="ouraActivityCard">加载中…</div>
    <div class="dash-section-title">🧠 AI 健康解读</div>
    <div class="progress-card" id="ouraAnalysisCard">加载中…</div>
    <div class="dash-section-title">📊 近7天时间分布</div>
    <div id="weeklyBars"></div>
    <div class="dash-section-title">🎯 求职漏斗</div>
    <div id="funnelStats"></div>
    <div class="dash-section-title">🔥 连续打卡</div>
    <div id="streakList"></div>
    <div class="dash-section-title">⏸️ 长期没动的线程</div>
    <div id="staleList"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>每周确认</h2>
    <p class="progress" id="ciProgress"></p>
    <p class="title" id="ciTitle"></p>
    <p class="card-notes" id="ciNotes"></p>
    <textarea id="ciNote" placeholder="这周的进展 / 备注（可选，会追加到这条线程）"></textarea>
    <div class="sheet-actions">
      <button class="btn-primary" onclick="ciAction('active')">继续推进</button>
      <button class="btn-ghost" onclick="ciAction('watch')">先搁置</button>
    </div>
    <div class="sheet-actions" style="margin-top:8px;">
      <button class="chip danger" style="width:100%; padding:12px;" onclick="ciAction('archived')">已完成 / 归档</button>
      <button class="btn-ghost" onclick="ciSkip()">跳过这条</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'thread-kanban-data';
const PIPELINE_KEY = 'job-pipeline-data';
const DAILY_KEY = 'daily-log-data';

/* ---- Oura + AI analysis: now proxied through our own Pages Function (same-origin, no CORS/CSP issue) ---- */
const OURA_CSV_URL = '/api/oura/raw';
const OURA_ANALYSIS_CSV_URL = '/api/oura/analysis';

// 兜底快照：网页环境的 fetch() 被 robots.txt 挡住时使用。
// 每次你说"同步一下Oura"，我会用 Google Drive 直接读取最新数据，更新这里。
const OURA_SNAPSHOT = {
  'Date': '2026-08-21', 'Sleep Score': '85', 'Sleep Efficiency': '70', 'Readiness Score': '79', 'Activity Score': '66',
  'Steps': '6681', 'Active Calories': '199', 'Avg HRV': '17', 'Avg Resting HR': '78',
  'Stress High (min)': '165', 'Recovery High (min)': '30', 'Avg SpO2 %': '94.432', 'Resilience Level': 'solid'
};
const OURA_ANALYSIS_SNAPSHOT = [
  { 'Date': '2026-08-22', 'Period': 'day',
    'Summary': '你的睡眠评分不错，但睡眠效率偏低（70%），卧床时间较长且不安睡期较多，提示夜间觉醒或浅睡偏多；同时静息心率偏高（78）、HRV偏低（17），压力时段较长（165分钟），身体整体处于"高压力、恢复不足"的状态。建议今晚睡前做10分钟腹式呼吸或正念冥想，并提前30分钟远离屏幕，以降低压力水平、提升睡眠连续性和次日恢复力。' }
];

function parseCSV(text){
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const row = {};
    headers.forEach((h, i) => row[h] = (cells[i] || '').trim());
    return row;
  });
}

const STEP_GOAL = 8000;
const ACTIVE_CAL_GOAL = 350;
const RESILIENCE_SCORE = { limited:20, adequate:40, solid:60, strong:80, exceptional:100 };
const RESILIENCE_LABEL = { limited:'有限', adequate:'一般', solid:'稳健', strong:'强韧', exceptional:'卓越' };

function num(v){
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

let ouraRows = [];
async function loadOuraRows(){
  try{
    const res = await fetch(OURA_CSV_URL);
    if(!res.ok) throw new Error('bad response');
    const rows = parseCSV(await res.text()).filter(r => r['Date']);
    ouraRows = rows.length ? rows : [OURA_SNAPSHOT];
  }catch(e){
    console.error('oura raw fetch failed', e);
    ouraRows = [OURA_SNAPSHOT];
  }
}

function latestRowWithFields(fields){
  for(let i = ouraRows.length - 1; i >= 0; i--){
    const r = ouraRows[i];
    if(fields.every(f => r[f] !== undefined && r[f] !== '' && !(f === 'Avg SpO2 %' && num(r[f]) === 0))) return r;
  }
  return null;
}

function radarChartSVG(dims, size){
  const n = dims.length;
  const cx = size/2, cy = size/2, r = size/2 - 34;
  const angle = i => -Math.PI/2 + i * (2*Math.PI/n);
  const ringPolys = [0.25, 0.5, 0.75, 1].map(f => {
    const pts = dims.map((d,i) => { const a = angle(i); return `${cx + Math.cos(a)*r*f},${cy + Math.sin(a)*r*f}`; }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#e5e2da" stroke-width="1"/>`;
  }).join('');
  const axisLines = dims.map((d,i) => {
    const a = angle(i);
    return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a)*r}" y2="${cy + Math.sin(a)*r}" stroke="#e5e2da" stroke-width="1"/>`;
  }).join('');
  const dataPts = dims.map((d,i) => {
    const a = angle(i);
    const v = Math.max(0, Math.min(100, d.value)) / 100 * r;
    return `${cx + Math.cos(a)*v},${cy + Math.sin(a)*v}`;
  }).join(' ');
  const labels = dims.map((d,i) => {
    const a = angle(i);
    const lx = cx + Math.cos(a)*(r+22), ly = cy + Math.sin(a)*(r+22);
    return `<text x="${lx}" y="${ly}" font-size="11.5" fill="#8a8578" text-anchor="middle" dominant-baseline="middle">${escapeHtml(d.label)}</text>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${ringPolys}${axisLines}
    <polygon points="${dataPts}" fill="#3d6b5c" fill-opacity="0.28" stroke="#3d6b5c" stroke-width="2"/>
    ${labels}
  </svg>`;
}

function renderOuraOverview(){
  const el = document.getElementById('ouraOverviewCard');
  const row = latestRowWithFields(['Sleep Score','Readiness Score','Activity Score']);
  if(!row){ el.innerHTML = '<div class="empty">加载失败，或还未配置 Oura 数据源</div>'; return; }
  const spo2 = num(row['Avg SpO2 %']);
  const resilience = (row['Resilience Level'] || '').trim().toLowerCase();
  const dims = [
    { label:'睡眠', value: num(row['Sleep Score']) ?? 0 },
    { label:'恢复', value: num(row['Readiness Score']) ?? 0 },
    { label:'活动', value: num(row['Activity Score']) ?? 0 },
    { label:'压力韧性', value: RESILIENCE_SCORE[resilience] ?? 50 },
    { label:'血氧', value: spo2 ? Math.max(0, Math.min(100, (spo2 - 90) / 10 * 100)) : 50 }
  ];
  const tag = resilience ? `<span class="stage-badge stage-offer" style="margin-left:8px;">韧性：${RESILIENCE_LABEL[resilience] || row['Resilience Level']}</span>` : '';
  el.innerHTML = `
    <div style="font-weight:700; font-size:14.5px; margin-bottom:4px;">${escapeHtml(row['Date'])}${tag}</div>
    <div style="display:flex; justify-content:center;">${radarChartSVG(dims, 220)}</div>
  `;
}

function smoothPath(points){
  if(points.length < 2) return `M ${points[0][0]},${points[0][1]}`;
  let d = `M ${points[0][0]},${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i===0?0:i-1], p1 = points[i], p2 = points[i+1];
    const p3 = points[Math.min(i+2,points.length-1)];
    const cp1x = p1[0] + (p2[0]-p0[0])/6, cp1y = p1[1] + (p2[1]-p0[1])/6;
    const cp2x = p2[0] - (p3[0]-p1[0])/6, cp2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function dualLineChartSVG(labels, seriesA, seriesB){
  const w = 300, h = 120, padX = 8, padY = 14;
  const scale = arr => {
    const min = Math.min(...arr), max = Math.max(...arr), range = (max - min) || 1;
    return arr.map(v => h - padY - ((v - min) / range) * (h - padY*2));
  };
  const ys1 = scale(seriesA), ys2 = scale(seriesB);
  const stepX = labels.length > 1 ? (w - padX*2) / (labels.length - 1) : 0;
  const pts1 = ys1.map((y,i) => [padX + i*stepX, y]);
  const pts2 = ys2.map((y,i) => [padX + i*stepX, y]);
  const labelEls = labels.map((l,i) => (i===0 || i===labels.length-1 || i===Math.floor(labels.length/2))
    ? `<text x="${padX+i*stepX}" y="${h-1}" font-size="9.5" fill="#8a8578" text-anchor="middle">${escapeHtml(l)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">
    <path d="${smoothPath(pts1)}" fill="none" stroke="#3d6b5c" stroke-width="2"/>
    <path d="${smoothPath(pts2)}" fill="none" stroke="#c1573f" stroke-width="2"/>
    ${labelEls}
  </svg>`;
}

function ringSVG(pct, size, color, label){
  const r = size/2 - 8, circumference = 2*Math.PI*r;
  const dash = circumference * Math.max(0, Math.min(1, pct/100));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#efefec" stroke-width="10"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${dash} ${circumference}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2 - 4}" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">${Math.round(pct)}%</text>
    <text x="${size/2}" y="${size/2 + 14}" font-size="10" fill="#8a8578" text-anchor="middle">${escapeHtml(label)}</text>
  </svg>`;
}

function parseAiSummary(text){
  if(!text) return null;
  const ratingMatch = text.match(/核心状态评级[：:]\s*([^\n]+)/);
  const warnMatch = text.match(/异常维度预警[^：:]*[：:]?\s*([\s\S]*?)(?=(今日|下阶段|高优先级行动)|$)/);
  const actionMatch = text.match(/(今日\/?下阶段高优先级行动|高优先级行动|行动建议)[^：:]*[：:]?\s*([\s\S]*)$/);
  if(!ratingMatch && !warnMatch && !actionMatch) return null;
  return {
    rating: ratingMatch ? ratingMatch[1].trim() : '',
    warnings: warnMatch ? warnMatch[1].trim() : '',
    actions: actionMatch ? actionMatch[2].trim() : ''
  };
}

    ).join('') + `</div>`;
  const matches = ouraAnalysisRows.filter(r => r['Period'] === period);
  const latest = matches[matches.length - 1];
  if(!latest){ el.innerHTML = tabsHtml + '<div class="empty">暂无数据，或还未配置数据源</div>'; return; }

  const bodyHtml = parsed ? `

      ${parsed.warnings ? `<div style="margin:8px 0;"><div style="font-weight:600; font-size:12.5px; margin-bottom:4px;">⚠️ 异常预警</div><p class="card-notes" style="font-size:13px;">${escapeHtml(parsed.warnings)}</p></div>` : ''}
      ${parsed.actions ? `<div style="margin:8px 0;"><div style="font-weight:600; font-size:12.5px; margin-bottom:4px;">✅ 行动建议</div><p class="card-notes" style="font-size:13px;">${escapeHtml(parsed.actions)}</p></div>` : ''}
    ` : `<p class="card-notes" style="font-size:13.5px;">${escapeHtml(latest['Summary'] || '')}</p>`;
  el.innerHTML = tabsHtml +
    `<details open>
      <summary style="cursor:pointer; font-weight:600; font-size:13px; margin-bottom:6px;">诊断详情</summary>
      ${bodyHtml}
    </details>
     <p class="card-meta">${escapeHtml(latest['Date'] || '')}</p>`;
}

async function kvGet(key){
  const res = await fetch('/api/storage/' + encodeURIComponent(key));
  if(!res.ok) throw new Error('kv get failed');
  const text = await res.text();
  return text === 'null' ? null : JSON.parse(text);
}
async function kvSet(key, value){
  const res = await fetch('/api/storage/' + encodeURIComponent(key), {
    method: 'PUT',
    body: JSON.stringify(value)
  });
  return res.ok;
}

async function loadState(){
  try{
    const val = await kvGet(STORAGE_KEY);
    if(val){ state = val; }
    else { state.tasks = seedTasks.map(t => ({ id: uid(), ...t, updatedAt: Date.now() })); await saveState(); }
  }catch(e){
    state.tasks = seedTasks.map(t => ({ id: uid(), ...t, updatedAt: Date.now() }));
    await saveState();
  }
  try{
    const val2 = await kvGet(PIPELINE_KEY);
    if(val2){ pipeline = val2; }
  }catch(e){}
  try{
    const val3 = await kvGet(DAILY_KEY);
    if(val3){ dailyLog = val3; }
  }catch(e){}
  render();
  renderPipeline();
  renderDaily();
  renderDashboard();
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function trySave(key, dataObj, label){
  for(let attempt=0; attempt<3; attempt++){
    try{
      const ok = await kvSet(key, dataObj);
      if(ok) return true;
    }catch(e){
      console.error(label+' save attempt '+(attempt+1)+' failed', e);
    }
    if(attempt<2) await sleep(600);
  }
  showToast('保存失败，请检查网络后重试');
  return false;
}

function escapeHtml(s){

}

async function resetHours(taskId){
  const date = todayStr(0);
  const entry = getEntry(date);
  entry.hours[taskId] = 0;
  await saveDaily();
  renderDaily();
}

/* ---- Dashboard ---- */
function last7Days(){
  const days = [];
  for(let i=6;i>=0;i--) days.push(todayStr(-i));
  return days;
}
function sumHoursForTask(taskId, days){
  let sum = 0;
  days.forEach(d => { const e = dailyLog.entries[d]; if(e && e.hours[taskId]) sum += e.hours[taskId]; });
  return sum;
}
function allTimeHoursForTask(taskId){
  let sum = 0;
  Object.keys(dailyLog.entries).forEach(d => { const e = dailyLog.entries[d]; if(e.hours[taskId]) sum += e.hours[taskId]; });
  return sum;
}
function lastActiveDate(taskId){
  let latest = null;
  Object.keys(dailyLog.entries).forEach(d => {
    const e = dailyLog.entries[d];
    if(e.hours[taskId] && e.hours[taskId] > 0){ if(!latest || d > latest) latest = d; }
  });
  return latest;
}
function streakForTask(taskId){
  let streak = 0;
  for(let i=0;i<60;i++){
    const d = todayStr(-i);
    const e = dailyLog.entries[d];
    if(e && e.hours[taskId] > 0) streak++;
    else break;
  }
  return streak;
}
function daysBetween(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date(todayStr(0) + 'T00:00:00');
  return Math.round((target - now) / 86400000);
}

function renderDashboard(){
  loadOuraRows().then(() => {
    renderOuraOverview();
    renderOuraTrend();
    renderOuraActivity();
  });
  loadOuraAnalysis();

  // Farewell video progress
  const fv = state.tasks.find(t => t.budgetHours);
  const fvCard = document.getElementById('farewellProgressCard');
  if(fv){
    const done = allTimeHoursForTask(fv.id);
    const pct = Math.min(100, Math.round((done / fv.budgetHours) * 100));
    const daysLeft = fv.deadline ? daysBetween(fv.deadline) : null;
    fvCard.innerHTML = `
      <div style="font-weight:700; font-size:14.5px; margin-bottom:6px;">🎬 ${escapeHtml(fv.title)} 进度</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div style="font-size:12.5px; color:var(--sub);">已投入 ${done}h / 预算 ${fv.budgetHours}h（${pct}%）${daysLeft !== null ? ` · 距 9/9 还剩 ${daysLeft} 天` : ''}</div>`;
  } else {
    fvCard.innerHTML = '';
  }

  // Weekly bar chart (includes archived tasks so past logged hours don't disappear once archived)
  const days = last7Days();
  const totals = state.tasks.map(t => ({ t, h: sumHoursForTask(t.id, days) })).filter(x => x.h > 0);
  const maxH = Math.max(1, ...totals.map(x => x.h));
  const barsEl = document.getElementById('weeklyBars');
  barsEl.innerHTML = totals.length ? totals.sort((a,b)=>b.h-a.h).map(x => `
    <div class="bar-row">
      <div class="bar-label"><span>${escapeHtml(x.t.title)}${x.t.column === 'archived' ? ' <span class="sub" style="font-weight:400;">（已归档）</span>' : ''}</span><span>${x.h}h</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(x.h/maxH*100)}%;"></div></div>
    </div>`).join('') : '<div class="empty">这周还没有打卡记录</div>';

  // Job funnel
  const stages = ['applied','screen','interview','final','offer','rejected'];
  const counts = {};
  stages.forEach(s => counts[s] = 0);
  pipeline.companies.forEach(c => { if(counts[c.stage] !== undefined) counts[c.stage]++; });
  const funnelEl = document.getElementById('funnelStats');
  funnelEl.innerHTML = `<div class="card active" style="padding:12px 14px;">` +
    stages.map(s => `<div class="streak-row"><span>${stageLabels[s]}</span><span>${counts[s]}</span></div>`).join('') +
    `</div>`;

  // Streaks
  const streakEl = document.getElementById('streakList');
  const activeOnly = state.tasks.filter(t => t.column === 'active');
  streakEl.innerHTML = activeOnly.length ? `<div class="card active" style="padding:6px 14px;">` +
    activeOnly.map(t => `<div class="streak-row"><span>${escapeHtml(t.title)}</span><span>${streakForTask(t.id) > 0 ? '🔥 ' + streakForTask(t.id) + '天' : '—'}</span></div>`).join('') +
    `</div>` : '<div class="empty">暂无</div>';

  // Stale threads (no log in 14+ days, or never logged)
  const staleEl = document.getElementById('staleList');
  const staleItems = state.tasks.filter(t => t.column !== 'archived').map(t => {
    const last = lastActiveDate(t.id);
    const daysSince = last ? Math.abs(daysBetween(last)) : null;
    return { t, last, daysSince };
  }).filter(x => x.daysSince === null || x.daysSince >= 14);
  staleEl.innerHTML = staleItems.length ? staleItems.map(x => `
    <div class="stale-item">${escapeHtml(x.t.title)} — ${x.last ? `已 ${x.daysSince} 天没打卡` : '还没打过卡'}</div>
  `).join('') : '<div class="empty">目前没有长期停滞的线程</div>';
}

loadState();
</script>
</body>
</html>
