<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多线程任务看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#2b2b2b; --sub:#8a8578;
    --active:#3d6b5c; --active-bg:#e8f2ee;
    --watch:#a3742f; --watch-bg:#faf1e2;
    --archived:#8a8578; --archived-bg:#efefec;
    --accent:#c1573f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:80px;
  }
  header{
    padding:20px 16px 0; position:sticky; top:0; background:var(--bg); z-index:10;
    border-bottom:1px solid #e5e2da;
  }
  h1{font-size:19px; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:13px; margin:0;}
  .toolbar{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  button{
    font-family:inherit; border:none; border-radius:10px; padding:9px 14px;
    font-size:13.5px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{background:var(--accent); color:#fff; font-weight:600;}
  .btn-ghost{background:#fff; color:var(--ink); border:1px solid #ddd8cc;}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .tabs{display:flex; gap:0; margin-top:14px; overflow-x:auto;}
  .tab{
    flex:1; text-align:center; padding:10px 4px; font-size:12.5px; font-weight:600;
    color:var(--sub); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .tab.on{color:var(--ink); border-bottom-color:var(--accent);}
  main{padding:14px 16px;}
  .view{display:none;}
  .view.on{display:block;}
  .col{margin-bottom:22px;}
  /* Desktop: centered page, board columns side by side, other views at reading width. Phones keep the stacked layout. */
  @media (min-width: 900px){
    header{padding-left:max(24px, calc((100% - 1232px) / 2)); padding-right:max(24px, calc((100% - 1232px) / 2));}
    main{max-width:1280px; margin:0 auto;}
    main{padding:18px 24px;}
    .tabs{justify-content:flex-start;}
    .tab{flex:0 0 auto; padding:10px 18px; font-size:13.5px;}
    .board{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:14px; align-items:start;}
    .tasks-board{grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px;}
    .board .col{background:#efede7; border-radius:16px; padding:12px; margin-bottom:0;}
    .add-form{max-width:560px;}
    #view-pipeline, #view-daily, #view-health{max-width:900px;}
    .dash-grid{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:18px; align-items:start;}
    .dash-grid .panel{background:#efede7; border-radius:16px; padding:4px 16px 14px; margin-bottom:18px;}
    .dash-grid .panel .dash-section-title{margin-top:12px;}
    #list-companies, #list-contacts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
    #list-companies .card, #list-contacts .card{margin-bottom:0;}
  }
  .col-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.active{background:var(--active);}
  .dot.watch{background:var(--watch);}
  .dot.archived{background:var(--archived);}
  .col-title{font-weight:700; font-size:14.5px;}
  .col-count{color:var(--sub); font-size:12.5px;}
  .col-desc{color:var(--sub); font-size:12px; margin:-4px 0 8px;}
  .task-project{font-size:11.5px; color:var(--sub); margin:0 0 6px;}
  /* Dashboard figures. Task-status ramp: one green hue light→dark (todo→doing→done) + amber for waiting/blocked. */
  :root{ --seg-todo:#9fcbb6; --seg-doing:#4f9a7c; --seg-waiting:#c7811f; --seg-done:#1f5f47; }
  .kpi-row{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:14px 0 6px;}
  .kpi{background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  .kpi-label{font-size:12px; color:var(--sub);}
  .kpi-value{font-size:26px; font-weight:600; margin-top:2px;}
  .kpi-value small{font-size:13px; font-weight:400; color:var(--sub); margin-left:2px;}
  @media (max-width: 520px){ .kpi-row{grid-template-columns:repeat(2, minmax(0,1fr));} }
  .seg-bar{display:flex; gap:2px; height:8px; margin:8px 0 2px; border-radius:4px; overflow:hidden; background:#eceae4;}
  .seg-bar span{display:block; height:100%;}
  .seg-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin:-2px 0 8px;}
  .seg-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .seg-counts{font-size:12px; color:var(--sub);}
  .panel-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .acc-toggle{display:flex; gap:4px; margin-top:12px;}
  .acc-toggle .chip.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .acc-chart{position:relative; height:220px;}
  .acc-chart svg{display:block; width:100%; height:100%; overflow:visible;}
  .acc-chart text{font-size:10.5px; fill:var(--sub);}
  /* Series slots (validated: 4 hues + gray "other"); a project keeps its slot by all-time hours rank. */
  :root{ --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s-other:#6f6b62; }
  .wk-chart{display:flex; align-items:flex-end; gap:6px; height:190px; padding:18px 0 0; border-bottom:1px solid #dcd8ce;}
  .wk-col{flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; cursor:default;}
  .wk-col:hover, .wk-col:focus{background:rgba(0,0,0,0.04); outline:none;}
  .wk-stack{display:flex; flex-direction:column-reverse; gap:2px;}
  .wk-stack span{display:block; min-height:2px;}
  .wk-stack span:last-child{border-radius:4px 4px 0 0;}
  .wk-total{font-size:11px; color:var(--sub); text-align:center; margin-bottom:3px;}
  .wk-labels{display:flex; gap:6px; font-size:10.5px; color:var(--sub); margin-top:4px;}
  .wk-labels span{flex:1; text-align:center;}
  .hbar{display:grid; grid-template-columns:minmax(0,1fr) 46px; gap:4px 10px; align-items:center; font-size:13px; padding:3px 0;}
  .hbar-track{grid-column:1 / -1; height:8px; background:#eceae4; border-radius:4px; overflow:hidden;}
  .hbar-track > span{display:block; height:100%; border-radius:0 4px 4px 0;}
  .hbar-val{text-align:right; font-variant-numeric:tabular-nums; color:var(--sub);}
  details.proj-total{background:var(--card); border-radius:14px; padding:8px 14px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  details.proj-total summary{list-style:none; cursor:pointer;}
  details.proj-total summary::-webkit-details-marker{display:none;}
  details.proj-total .hbar.sub-bar{padding-left:14px; font-size:12.5px;}
  .viz-tip{position:fixed; z-index:100; pointer-events:none; background:#2b2b2b; color:#fff; font-size:12px; line-height:1.5; padding:6px 9px; border-radius:8px; white-space:pre; display:none; max-width:320px;}
  .card{
    background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05); border-left:4px solid transparent;
  }
  .card.active{border-left-color:var(--active);}
  .card.watch{border-left-color:var(--watch);}
  .card.archived{border-left-color:var(--archived); opacity:0.6;}
  .card-title{font-weight:600; font-size:15px; margin:0 0 4px;}
  .card-notes{font-size:13px; color:#555; margin:0 0 6px; white-space:pre-wrap;}
  .card-meta{font-size:11.5px; color:var(--sub); margin-bottom:8px;}
  .card-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .chip{
    font-size:12px; padding:5px 10px; border-radius:20px; border:1px solid #e0dccf;
    background:#fbfaf7; color:var(--ink);
  }
  .chip.danger{color:var(--accent); border-color:#f0d6cd;}
  .chip.hours{background:var(--active-bg); color:var(--active); border-color:transparent; font-weight:600;}
  .empty{color:var(--sub); font-size:13px; padding:6px 2px;}
  .card-tasks{margin:0 0 8px; font-size:13px;}
  .card-tasks summary{cursor:pointer; color:var(--sub); font-size:12.5px;}
  .task-row{display:flex; gap:6px; align-items:center; margin:6px 0;}
  .task-row span{flex:1; min-width:0; overflow-wrap:anywhere;}
  .task-row.done span{text-decoration:line-through; color:var(--sub);}
  .task-add{display:flex; gap:6px; margin-top:6px;}
  .task-add input{flex:1; min-width:0; border:1px solid #e0dccf; border-radius:8px; padding:6px 8px; font-family:inherit; font-size:13px;}
  .stage-badge{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px;
    font-weight:600; margin-bottom:6px;
  }
  .stage-applied{background:#eef1ea; color:#5c6b4a;}
  .stage-screen{background:#e8f0f7; color:#3a5f7d;}
  .stage-interview{background:#faf1e2; color:#a3742f;}
  .stage-final{background:#f3e8f5; color:#7a4a85;}
  .stage-offer{background:#e8f2ee; color:#3d6b5c;}
  .stage-rejected{background:#efefec; color:#8a8578;}
  .stage-contacted{background:#eef1ea; color:#5c6b4a;}
  .stage-replied{background:#e8f0f7; color:#3a5f7d;}
  .stage-meeting{background:#e8f2ee; color:#3d6b5c;}
  .stage-noresponse{background:#efefec; color:#8a8578;}
  select.stage-select{
    font-size:12.5px; padding:6px 8px; border-radius:8px; border:1px solid #e0dccf;
    font-family:inherit; background:#fbfaf7;
  }
  .pipeline-section-title, .dash-section-title{font-weight:700; font-size:14.5px; margin:18px 0 8px;}
  .add-form{display:none; background:#fff; border-radius:14px; padding:14px; margin-bottom:16px; border:1px solid #e5e2da;}
  .add-form.show{display:block;}
  .add-form input, .add-form textarea, .add-form select{
    width:100%; border:1px solid #e0dccf; border-radius:10px; padding:9px 10px;
    font-family:inherit; font-size:13.5px; margin-bottom:8px;
  }
  /* Daily log */
  .log-row{
    background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  .log-row-title{font-weight:600; font-size:14.5px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .log-today-total{font-size:12.5px; color:var(--active); font-weight:700;}
  .log-task{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-top:1px solid #f0ede6;}
  .log-task-name{flex:1; min-width:140px; font-size:13.5px;}
  .log-btns{display:flex; gap:6px; flex-wrap:wrap;}
  textarea.daily-note{
    width:100%; min-height:60px; border:1px solid #e0dccf; border-radius:10px;
    padding:10px; font-family:inherit; font-size:13.5px; resize:vertical; margin-top:6px;
  }
  /* Dashboard */
  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
  .bar-track{background:#efefec; border-radius:8px; height:10px; overflow:hidden;}
  .bar-fill{background:var(--active); height:100%; border-radius:8px;}
  .progress-card{background:#fff; border-radius:14px; padding:14px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  .progress-track{background:#efefec; border-radius:10px; height:14px; overflow:hidden; margin:8px 0;}
  .progress-fill{background:var(--accent); height:100%; border-radius:10px;}
  .attn-head{font-weight:700; font-size:13.5px; color:var(--accent); margin:2px 0 8px;}
  .attn-row{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding:3px 0;}
  .stale-item{
    background:#fff; border-radius:12px; padding:10px 14px; margin-bottom:8px;
    border-left:4px solid var(--watch); font-size:13px;
  }
  .streak-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #efefec; font-size:13.5px;}
  .streak-row:last-child{border-bottom:none;}
  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,28,22,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px 18px 26px; animation:up .18s ease-out; max-height:85vh; overflow-y:auto;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{font-size:15px; margin:0 0 2px;}
  .sheet .progress{font-size:12px; color:var(--sub); margin-bottom:14px;}
  .sheet .title{font-size:17px; font-weight:700; margin:0 0 8px;}
  .sheet textarea{
    width:100%; min-height:70px; border:1px solid #e0dccf; border-radius:10px;
    padding:10px; font-family:inherit; font-size:13.5px; resize:vertical; margin-bottom:14px;
  }
  .sheet-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .sheet-actions button{width:100%; padding:12px 8px; font-size:13.5px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#2b2b2b; color:#fff; padding:9px 18px; border-radius:20px;
    font-size:13px; opacity:0; transition:opacity .25s; z-index:200; pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
    <h1 id="appTitle">🗂️ 多线程任务看板</h1>
    <button class="chip btn-sm" id="langToggle" onclick="toggleLang()" style="flex-shrink:0;">EN</button>
  </div>
  <p class="sub" id="lastCheckin">加载中…</p>
  <div class="tabs">
    <div class="tab on" id="tab-kanban" onclick="switchTab('kanban')">宏观看板</div>
    <div class="tab" id="tab-tasks" onclick="switchTab('tasks')">任务</div>
    <div class="tab" id="tab-pipeline" onclick="switchTab('pipeline')">求职明细</div>
    <div class="tab" id="tab-daily" onclick="switchTab('daily')">今日打卡</div>
    <div class="tab" id="tab-health" onclick="switchTab('health')">健康总览</div>
    <div class="tab" id="tab-dash" onclick="switchTab('dash')">Dashboard</div>
  </div>
</header>

<main>
  <!-- KANBAN VIEW -->
  <div class="view on" id="view-kanban">
    <div class="toolbar" style="margin:14px 0;">
      <button class="btn-primary" id="btnStartCheckin" onclick="startCheckin()">开始每周确认</button>
      <button class="btn-ghost" id="btnAddThread" onclick="toggleAddForm()">+ 新增线程</button>
    </div>
    <div class="add-form" id="addForm">
      <div id="addFormTitle" style="font-weight:700; font-size:13.5px; margin-bottom:8px;">新增线程</div>
      <input type="text" id="newTitle" placeholder="线程名称，例如：面签复审">
      <textarea id="newNotes" placeholder="备注（可选）"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="btnAddSave" onclick="addTask()">保存</button>
        <button class="btn-ghost" id="btnAddCancel" onclick="toggleAddForm()">取消</button>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- PIPELINE VIEW -->
  <!-- TASKS VIEW: every project's tasks on one six-column board -->
  <div class="view" id="view-tasks">
    <div class="toolbar" style="margin:14px 0;">
      <select class="stage-select" id="taskFilter" onchange="taskFilter=this.value; renderTasks()" aria-label="Project"></select>
      <form class="task-add" id="taskAddForm" onsubmit="addItem(event)" style="flex:1; margin:0; min-width:260px;">
        <input name="title" id="taskAddTitle">
        <select class="stage-select" name="project" id="taskAddProject" aria-label="Project"></select>
        <button class="chip" id="taskAddBtn"></button>
      </form>
    </div>
    <div class="board tasks-board" id="taskBoard"></div>
  </div>

  <div class="view" id="view-pipeline">
    <p class="sub" id="pipelineIntro" style="margin:14px 0 0;">这里是随时更新的执行细节，不进每周确认流程。</p>
    <div class="pipeline-section-title" id="pipelineCompaniesTitle">📋 公司 / 面试进度</div>
    <div class="toolbar" style="margin-bottom:10px;">
      <button class="btn-ghost" id="btnAddCompany" onclick="toggleForm('companyForm')">+ 新增公司</button>
    </div>
    <div class="add-form" id="companyForm">
      <input type="text" id="coName" placeholder="公司名称">
      <select id="coStage">
        <option value="applied">已投递</option>
        <option value="screen">初筛/电话面</option>
        <option value="interview">面试中</option>
        <option value="final">终面</option>
        <option value="offer">Offer</option>
        <option value="rejected">已拒 / 结束</option>
      </select>
      <textarea id="coNotes" placeholder="备注，例如下一步动作/截止日期"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="btnCoSave" onclick="addCompany()">保存</button>
        <button class="btn-ghost" id="btnCoCancel" onclick="toggleForm('companyForm')">取消</button>
      </div>
    </div>
    <div id="list-companies"></div>

    <div class="pipeline-section-title" id="pipelineContactsTitle">🤝 Cold Outreach / 人脉联系</div>
    <div class="toolbar" style="margin-bottom:10px;">
      <button class="btn-ghost" id="btnAddContact" onclick="toggleForm('contactForm')">+ 新增联系人</button>
    </div>
    <div class="add-form" id="contactForm">
      <input type="text" id="ctName" placeholder="姓名 / 公司 / 职位">
      <select id="ctStage">
        <option value="contacted">已发送消息</option>
        <option value="replied">已回复</option>
        <option value="meeting">已约见 / 通话</option>
        <option value="noresponse">无回应</option>
      </select>
      <textarea id="ctNotes" placeholder="备注"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="btnCtSave" onclick="addContact()">保存</button>
        <button class="btn-ghost" id="btnCtCancel" onclick="toggleForm('contactForm')">取消</button>
      </div>
    </div>
    <div id="list-contacts"></div>
    <div class="dash-section-title" id="dashFunnelTitle">🎯 求职漏斗</div>
    <div id="funnelStats"></div>
  </div>

  <!-- DAILY LOG VIEW -->
  <div class="view" id="view-daily">
    <div style="display:flex; align-items:center; gap:10px; margin:14px 0 4px; flex-wrap:wrap;">
      <input type="date" id="dailyDatePicker" onchange="changeDailyDate(this.value)" style="font-size:13.5px; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-family:inherit;">
      <button class="chip btn-sm" onclick="changeDailyDate(todayStr(0))">回到今天</button>
    </div>
    <p class="sub" style="margin:6px 0 0;" id="dailyDateLabel"></p>
    <p class="sub" id="dailyIntro" style="margin:2px 0 14px;">点一下记录当天在这条线程上花的时间；选别的日期就是给那天补打卡。</p>
    <div id="list-dailylog"></div>
    <div class="dash-section-title" id="dailyNoteTitle">📝 备注</div>
    <textarea class="daily-note" id="dailyNoteInput" placeholder="当天大概做了什么（可选）" onblur="saveDailyNote()"></textarea>
  </div>

  <!-- HEALTH OVERVIEW VIEW -->
  <div class="view" id="view-health">
    <div class="dash-section-title" id="healthOverviewTitle">💍 健康总览（Oura）</div>
    <div class="progress-card" id="ouraOverviewCard">加载中…</div>
    <div class="dash-section-title" id="healthTrendTitle">📈 关键趋势（HRV / 静息心率）</div>
    <div class="progress-card" id="ouraTrendCard">加载中…</div>
    <div class="dash-section-title" id="healthActivityTitle">🏃 昨日活动</div>
    <div class="progress-card" id="ouraActivityCard">加载中…</div>
    <div class="dash-section-title" id="healthAiTitle">🧠 AI 健康解读</div>
    <div class="progress-card" id="ouraAnalysisCard">加载中…</div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div class="view" id="view-dash">
    <div class="kpi-row" id="kpiRow"></div>
    <div id="budgetCards"></div>
    <div class="dash-grid">
      <div class="dash-main">
        <section class="panel">
          <div class="dash-section-title" id="dashWeeksTitle">📊 每周投入（近 12 周）</div>
          <div class="seg-legend" id="weeksLegend"></div>
          <div class="wk-chart" id="weeksChart"></div>
          <div class="wk-labels" id="weeksLabels"></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div class="dash-section-title" id="dashAccTitle">📈 累计投入</div>
            <div class="acc-toggle" id="accToggle"></div>
          </div>

// Real CSV parser (handles quoted fields containing commas and embedded newlines,
// and "" as an escaped quote) — a naive split('\n')/split(',') breaks as soon as a
// cell (e.g. a multi-line AI summary) is quoted and spans multiple lines.
function parseCSV(text){
  const rows = [];
  let field = '', row = [], inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if(c === '"'){
      inQuotes = true;
    } else if(c === ','){
      row.push(field); field = '';
    } else if(c === '\n'){
      row.push(field); rows.push(row); row = []; field = '';
    } else if(c === '\r'){
      // skip
    } else {
      field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(cell => cell !== ''))
    .map(cols => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (cols[i] !== undefined ? cols[i] : '').trim());
      return obj;
    });
}

const STEP_GOAL = 8000;
const ACTIVE_CAL_GOAL = 350;
function resilienceLabel(key){ return t('res' + key.charAt(0).toUpperCase() + key.slice(1)); }

// SpO2 是 90%~100% 的窄区间指标，不能直接当 0-100 分画雷达图（会把血氧轴撑爆）。
// 按临床参考区间分段映射：98%+ 视为满分，94% 左右是及格线，90% 以下视为 0 分。
function spo2ToScore(spo2){
  const points = [[90,0],[93,50],[95,80],[97,95],[100,100]];
  if(spo2 <= points[0][0]) return 0;
  if(spo2 >= points[points.length-1][0]) return 100;
  for(let i=0;i<points.length-1;i++){
    const [x0,y0] = points[i], [x1,y1] = points[i+1];
    if(spo2 >= x0 && spo2 <= x1) return y0 + (spo2-x0)/(x1-x0)*(y1-y0);
  }
  return 50;
}

function num(v){
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

let ouraRows = [];
function fetchWithTimeout(url, ms){
  return fetch(url, { signal: AbortSignal.timeout(ms) });
}

async function loadOuraRows(){
  try{
    const res = await fetchWithTimeout(OURA_CSV_URL, 6000);
    if(!res.ok) throw new Error('bad response');
    const rows = parseCSV(await res.text()).filter(r => r['Date']);
    // The sheet occasionally has the same Date synced twice (e.g. a retried Apps Script run);
    // keep only the last row per date so trend windows count each day once, not twice.
    const byDate = new Map();
    rows.forEach(r => byDate.set(r['Date'], r));
    const deduped = [...byDate.values()];
    ouraRows = deduped.length ? deduped : [OURA_SNAPSHOT];
  }catch(e){
    console.error('oura raw fetch failed', e);
    ouraRows = [OURA_SNAPSHOT];
  }
}

function latestRowWithFields(fields){
  for(let i = ouraRows.length - 1; i >= 0; i--){
    const r = ouraRows[i];
    if(fields.every(f => r[f] !== undefined && r[f] !== '')) return r;
  }
  return null;
}

function radarChartSVG(dims, size){
  const n = dims.length;
  const margin = 66; // extra room around the circle so long axis labels (esp. English) don't clip
  const vb = size + margin*2;
  const cx = vb/2, cy = vb/2, r = size/2 - 10;
  const angle = i => -Math.PI/2 + i * (2*Math.PI/n);
  const ringPolys = [0.25, 0.5, 0.75, 1].map(f => {
    const pts = dims.map((d,i) => { const a = angle(i); return `${cx + Math.cos(a)*r*f},${cy + Math.sin(a)*r*f}`; }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#e5e2da" stroke-width="1"/>`;
  }).join('');
  // 80分参考线（虚线），方便一眼看出哪些维度达标
  const refPts = dims.map((d,i) => { const a = angle(i); return `${cx + Math.cos(a)*r*0.8},${cy + Math.sin(a)*r*0.8}`; }).join(' ');
  const refRing = `<polygon points="${refPts}" fill="none" stroke="#c1573f" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>`;
  const axisLines = dims.map((d,i) => {
    const a = angle(i);
    return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a)*r}" y2="${cy + Math.sin(a)*r}" stroke="#e5e2da" stroke-width="1"/>`;
  }).join('');
  const dataPts = dims.map((d,i) => {
    const a = angle(i);
    const v = Math.max(0, Math.min(100, d.value)) / 100 * r;
    return `${cx + Math.cos(a)*v},${cy + Math.sin(a)*v}`;
  }).join(' ');
  const labels = dims.map((d,i) => {
    const a = angle(i);
    const lx = cx + Math.cos(a)*(r+22), ly = cy + Math.sin(a)*(r+22);
    const nameLines = d.label.includes(' ') ? d.label.split(' ') : [d.label];
    const lineH = 11;
    const nameStartY = ly - ((nameLines.length-1) * lineH)/2 - 6;
    const nameHtml = nameLines.map((w,li) =>
      `<text x="${lx}" y="${nameStartY + li*lineH}" font-size="10.5" fill="#8a8578" text-anchor="middle" dominant-baseline="middle">${escapeHtml(w)}</text>`
    ).join('');
    const valueY = nameStartY + nameLines.length*lineH + 5;
    return nameHtml + `<text x="${lx}" y="${valueY}" font-size="11" font-weight="700" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle">${escapeHtml(d.display)}</text>`;
  }).join('');
  return `<svg width="${vb}" height="${vb}" viewBox="0 0 ${vb} ${vb}">
    ${ringPolys}${refRing}${axisLines}
    <polygon points="${dataPts}" fill="#3d6b5c" fill-opacity="0.28" stroke="#3d6b5c" stroke-width="2"/>
    ${labels}
  </svg>`;
}

// Oura's own published score bands, so a bare number doesn't leave the reader guessing "is 66 good?"
function scoreBand(v){
  if(v >= 85) return t('bandOptimal');

  if(v >= 60) return t('bandFair');
  return t('bandAttention');
}
function bandStyle(v){
  if(v >= 70) return 'background:var(--active-bg); color:var(--active); border-color:transparent; font-weight:600;';
  if(v >= 60) return 'background:var(--watch-bg); color:var(--watch); border-color:transparent; font-weight:600;';
  return 'background:#f7e3dd; color:var(--accent); border-color:transparent; font-weight:600;';
}

function smoothPath(points){
  if(points.length < 2) return `M ${points[0][0]},${points[0][1]}`;
  let d = `M ${points[0][0]},${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i===0?0:i-1], p1 = points[i], p2 = points[i+1];
    const p3 = points[Math.min(i+2,points.length-1)];
    const cp1x = p1[0] + (p2[0]-p0[0])/6, cp1y = p1[1] + (p2[1]-p0[1])/6;
    const cp2x = p2[0] - (p3[0]-p1[0])/6, cp2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function average(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function stddev(arr){
  if(arr.length < 2) return 0;
  const m = average(arr);
  return Math.sqrt(arr.reduce((s,v) => s+(v-m)*(v-m), 0) / arr.length);
}

// Single composite "net recovery" score (0-100, 50=baseline) instead of two diverging raw lines:
// HRV z-score (higher=better) minus RHR z-score (lower=better), averaged and rescaled.
// Avoids forcing the reader to mentally flip the polarity of two opposite-direction metrics.
// Discrete per-day energy bars instead of a line: each day is one bar, colored
// green/gray/red against a labeled 0/50/100 scale. Bars read as "state per day"
// at a glance, without asking the reader to track a wavy line's slope.
function batteryColor(v){ return v >= 60 ? '#3d6b5c' : v < 40 ? '#c1573f' : '#8a8578'; }
function batteryBarsSVG(labels, scores){
  const w = 300, h = 100, padX = 20, padY = 6, labelY = h + 12;
  const toY = v => h - padY - (v/100)*(h-padY*2);
  const baseline = toY(50);
  const stepX = (w - padX*2) / labels.length;
  const barW = Math.min(18, stepX * 0.62);
  const fontSize = labels.length > 10 ? 7 : 8.5;
  const trackTop = toY(100), trackBottom = toY(0);
  const minBarH = 3; // floor so a near-zero score still shows a visible sliver instead of looking like missing data
  const bars = scores.map((v,i) => {
    const cx = padX + stepX*i + stepX/2;
    const barH = Math.max(minBarH, h - padY - toY(v));
    const y = (h - padY) - barH;
    return `<rect x="${(cx-barW/2).toFixed(1)}" y="${trackTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${(trackBottom-trackTop).toFixed(1)}" rx="2" fill="#8a8578" opacity="0.07"/>
      <rect x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${batteryColor(v)}"/>`;
  }).join('');
  const labelEls = labels.map((l,i) => {
    const cx = padX + stepX*i + stepX/2;
    return `<text x="${cx}" y="${labelY}" font-size="${fontSize}" fill="#8a8578" text-anchor="middle">${escapeHtml(l)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${labelY+4}" style="width:100%; height:auto; display:block;">
    <line x1="${padX}" y1="${toY(100)}" x2="${w-padX}" y2="${toY(100)}" stroke="#e5e2da" stroke-width="1"/>
    <line x1="${padX}" y1="${baseline}" x2="${w-padX}" y2="${baseline}" stroke="#8a8578" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="${padX}" y1="${toY(0)}" x2="${w-padX}" y2="${toY(0)}" stroke="#e5e2da" stroke-width="1"/>
    <text x="2" y="${toY(100)+3}" font-size="7.5" fill="#8a8578">100</text>
    <text x="2" y="${baseline+3}" font-size="7.5" fill="#8a8578">${t('avgLabel')}</text>
    <text x="6" y="${toY(0)+3}" font-size="7.5" fill="#8a8578">0</text>
    ${bars}
    ${labelEls}
  </svg>`;
}

function dualLineChartSVG(labels, seriesA, seriesB, baselineA, baselineB){
  const w = 300, h = 92, padX = 10, padY = 8, labelY = h + 12;
  const scaleFor = (arr, base) => {
    const all = (base !== null && base !== undefined) ? [...arr, base] : arr;
    const min = Math.min(...all), max = Math.max(...all), range = (max - min) || 1;
    return v => h - padY - ((v - min) / range) * (h - padY*2);
  };
  const toY1 = scaleFor(seriesA, baselineA);
  const toY2 = scaleFor(seriesB, baselineB);
  const stepX = labels.length > 1 ? (w - padX*2) / (labels.length - 1) : 0;
  const pts1 = seriesA.map((v,i) => [padX + i*stepX, toY1(v)]);
  const pts2 = seriesB.map((v,i) => [padX + i*stepX, toY2(v)]);
  const base1 = (baselineA !== null && baselineA !== undefined)
    ? `<line x1="${padX}" y1="${toY1(baselineA)}" x2="${w-padX}" y2="${toY1(baselineA)}" stroke="#3d6b5c" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>` : '';
  const base2 = (baselineB !== null && baselineB !== undefined)
    ? `<line x1="${padX}" y1="${toY2(baselineB)}" x2="${w-padX}" y2="${toY2(baselineB)}" stroke="#c1573f" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>` : '';
  const fontSize = labels.length > 10 ? 7 : 8.5;
  const labelEls = labels.map((l,i) =>
    `<text x="${padX+i*stepX}" y="${labelY}" font-size="${fontSize}" fill="#8a8578" text-anchor="middle">${escapeHtml(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${labelY+4}" style="width:100%; height:auto; display:block;">
    ${base1}${base2}
    <path d="${smoothPath(pts1)}" fill="none" stroke="#3d6b5c" stroke-width="2"/>
    <path d="${smoothPath(pts2)}" fill="none" stroke="#c1573f" stroke-width="2"/>
    ${labelEls}
  </svg>`;
}

let trendRange = 7;
function renderOuraTrend(range){
  if(range) trendRange = range;
  const el = document.getElementById('ouraTrendCard');
  const validRows = ouraRows.filter(r => num(r['Avg HRV']) !== null && num(r['Avg Resting HR']) !== null);
  // Window by actual calendar days from the latest available date, not just "last N rows with
  // data" — otherwise a long gap in HRV/RHR readings would let a "7天" tab silently pull in rows
  // from weeks ago while still labeled as a 7-day window.
  const latestDate = validRows.length ? validRows[validRows.length - 1]['Date'] : null;
  const rows = latestDate
    ? validRows.filter(r => (new Date(latestDate) - new Date(r['Date'])) / 86400000 < trendRange)
    : [];
  const tabsHtml = `<div class="log-btns" style="margin-bottom:10px;">
    <button class="chip btn-sm${trendRange===7?' hours':''}" onclick="renderOuraTrend(7)">${t('trend7d')}</button>
    <button class="chip btn-sm${trendRange===14?' hours':''}" onclick="renderOuraTrend(14)">${t('trend14d')}</button>
  </div>`;
  if(rows.length < 2){ el.innerHTML = tabsHtml + `<div class="empty">${t('trendInsufficientData')}</div>`; return; }
  const hrv = rows.map(r => num(r['Avg HRV']));
  const rhr = rows.map(r => num(r['Avg Resting HR']));
  const dates = rows.map(r => r['Date'].slice(8));
  const allHrv = ouraRows.map(r => num(r['Avg HRV'])).filter(v => v !== null);
  const allRhr = ouraRows.map(r => num(r['Avg Resting HR'])).filter(v => v !== null);
  const meanHrv = average(allHrv), stdHrv = stddev(allHrv) || 1;
  const meanRhr = average(allRhr), stdRhr = stddev(allRhr) || 1;
  const scores = rows.map(r => {
    const h = num(r['Avg HRV']), b = num(r['Avg Resting HR']);
    const hrvZ = (h - meanHrv) / stdHrv, rhrZ = (meanRhr - b) / stdRhr;
    return Math.max(0, Math.min(100, 50 + ((hrvZ + rhrZ) / 2) * 25));
  });
  const latest = scores[scores.length - 1];
  const statusKey = latest >= 60 ? 'batteryHigh' : latest < 40 ? 'batteryLow' : 'batteryMid';
  const descKey = latest >= 60 ? 'batteryHighDesc' : latest < 40 ? 'batteryLowDesc' : 'batteryMidDesc';
  const statusColor = batteryColor(latest);
  const emoji = latest >= 60 ? '🟢' : latest < 40 ? '🔴' : '🟡';
  el.innerHTML = tabsHtml +
    `<div style="margin-bottom:10px;">
      <div style="font-weight:700; font-size:16px; color:${statusColor};">${emoji} ${t('todayStatusPrefix')}${t(statusKey)}（${Math.round(latest)}/100）</div>
      <div style="font-size:12.5px; color:var(--sub); margin-top:4px;">${t(descKey)}</div>
    </div>` +
    batteryBarsSVG(dates, scores) +
    `<details style="margin-top:10px;">
      <summary style="cursor:pointer; font-size:12px; color:var(--sub);">${t('viewRawData')}</summary>
      ${dualLineChartSVG(dates, hrv, rhr, meanHrv, meanRhr)}
      <div style="display:flex; gap:16px; margin-top:6px; font-size:12px; color:var(--sub);">
        <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#3d6b5c; margin-right:4px;"></span>${t('legendHrv')} ${hrv[hrv.length-1]}ms</span>
        <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#c1573f; margin-right:4px;"></span>${t('legendRhr')} ${rhr[rhr.length-1]}bpm</span>
      </div>
      <div style="font-size:11px; color:var(--sub); margin-top:4px;">${t('trendBaselineNote')}</div>
    </details>`;
}

function ringSVG(pct, size, color, label){
  const r = size/2 - 8, circumference = 2*Math.PI*r;

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${dash} ${circumference}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2 - 4}" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">${Math.round(pct)}%</text>
    <text x="${size/2}" y="${size/2 + 14}" font-size="10" fill="#8a8578" text-anchor="middle">${escapeHtml(label)}</text>
  </svg>`;
}

// Robust to how the model actually phrases headings: with/without "评级"/"维度",
// with/without markdown ** bold, with/without a "今日/下阶段" prefix on the action heading.
function parseAiSummary(text){
  if(!text) return null;
  const clean = text.replace(/\*\*/g, '');
  const headingRe = /(核心状态(?:评级)?|(?:异常(?:维度)?)?预警|(?:今日\/?下阶段)?高优(?:先级)?行动|行动建议|行动)\s*[：:]/g;
  const matches = [];
  let m;
  while((m = headingRe.exec(clean)) !== null){
    matches.push({ heading: m[1], index: m.index, contentStart: m.index + m[0].length });
  }
  if(!matches.length) return null;
  const sections = {};
  for(let i=0;i<matches.length;i++){
    const end = i+1 < matches.length ? matches[i+1].index : clean.length;
    let content = clean.slice(matches[i].contentStart, end);
    content = content.replace(/\s*-\s*$/, '').trim(); // strip a trailing bullet dash belonging to the next heading
    const h = matches[i].heading;
    if(h.indexOf('核心状态') === 0) sections.rating = content;
    else if(h.indexOf('预警') !== -1) sections.warnings = content;
    else sections.actions = content;
  }
  if(!sections.rating && !sections.warnings && !sections.actions) return null;
  return { rating: sections.rating || '', warnings: sections.warnings || '', actions: sections.actions || '' };
}

  const matches = ouraAnalysisRows.filter(r => r['Period'] === period)

  const latest = matches[matches.length - 1];
  if(!latest){ el.innerHTML = tabsHtml + `<div class="empty">${t('aiNoData')}</div>`; return; }
  const parsed = parseAiSummary(latest['Summary']);

      ${parsed.actions ? `<div style="margin:8px 0;"><div style="font-weight:600; font-size:12.5px; margin-bottom:4px;">${t('aiActions')}</div><p class="card-notes" style="font-size:13px;">${escapeHtml(parsed.actions)}</p></div>` : ''}
    ` : `<p class="card-notes" style="font-size:13.5px;">${escapeHtml(latest['Summary'] || '')}</p>`;
  el.innerHTML = tabsHtml +
    `<details open>
      <summary style="cursor:pointer; font-weight:600; font-size:13px; margin-bottom:6px;">${t('aiDetailsSummary')}</summary>
      ${bodyHtml}
    </details>
     <p class="card-meta">${escapeHtml(latest['Date'] || '')}</p>`;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(offset){
  offset = offset || 0;
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function kvGet(key){
  const res = await fetch('/api/storage/' + encodeURIComponent(key));
  if(!res.ok) throw new Error('kv get failed');
  const text = await res.text();
  kvRevs[key] = res.headers.get('ETag'); // 保存时带回这个版本号，云端已被别处改过就会被拒（409）
  return text === 'null' ? null : JSON.parse(text);
}
const kvRevs = {};
const kvChains = {};
// 同一个 key 的保存排队执行：上一次返回新版本号后再发下一次，否则同一页面连续两次保存会互相冲突。
// 返回 true（成功）/ false（可重试的失败）/ 'conflict'（云端已被其他设备或标签页改过）。
function kvSet(key, value){
  const run = async () => {
    const res = await fetch('/api/storage/' + encodeURIComponent(key), {
      method: 'PUT',
      headers: { 'If-Match': kvRevs[key] || '"0"' },
      body: JSON.stringify(value)
    });
    if(res.status === 409) return 'conflict';
    if(res.ok) kvRevs[key] = res.headers.get('ETag');
    return res.ok;
  };
  const p = (kvChains[key] || Promise.resolve()).then(run, run);
  kvChains[key] = p.catch(() => {});
  return p;
}

// 带重试的读取：网络抖动时不放弃，避免用空壳数据静默覆盖云端真实数据。
// 三次都失败时抛出异常，由调用方决定如何处理（而不是默默当成"没有数据"）。
async function kvGetWithRetry(key, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i=0; i<attempts; i++){
    try{
      return await kvGet(key);
    }catch(e){
      lastErr = e;
      if(i < attempts-1) await sleep(600);
    }
  }
  throw lastErr;
}

let stateLoadFailed = false;
let dailyLoadFailed = false;
let pipelineLoadFailed = false;

let awaitingSeedConfirm = false; // KV 读到空时，先展示种子任务但不保存，等用户明确点确认

async function loadState(){
  try{
    const val = await kvGetWithRetry(STORAGE_KEY);
    if(val){
      state = val;
      state.items = state.items || []; // docs saved before the Project/Task split have no items
    } else {
      // KV 里确实没有数据（可能是首次使用，也可能是异常情况）。
      // 只在界面上先"展示"一份初始模板，绝不在这里自动 saveState()——
      // 避免任何读到空值的情况（哪怕只是短暂的）悄悄把真实数据冲掉。
      state.tasks = seedTasks.map(t => ({ id: uid(), ...t, updatedAt: Date.now() }));
      awaitingSeedConfirm = true;
      showSeedConfirmBanner();
    }
  }catch(e){
    console.error('kanban load failed after retries', e);
    showToast('加载看板数据失败，请检查网络后刷新重试');
    // 看板主数据都没读成功，求职明细/打卡记录这两个 key 根本不会走到下面的读取，
    // 但对应的 xxxLoadFailed 之前一直保持默认的 false——导致后续如果用户照样点了
    // "打卡"，saveDaily() 的守卫形同虚设，会直接拿本地还没同步的空壳数据覆盖云端。
    // 这里必须显式把两个守卫都标记为失败，堵住这个数据覆盖的口子。
    stateLoadFailed = true;
    pipelineLoadFailed = true;
    dailyLoadFailed = true;
    render(); renderPipeline(); renderDaily(); renderDashboard();
    return; // 不要用种子数据覆盖保存，直接停止，避免后续任何保存动作把云端数据冲掉
  }
  try{
    const val2 = await kvGetWithRetry(PIPELINE_KEY);
    if(val2){ pipeline = val2; }
  }catch(e){
    pipelineLoadFailed = true;
    console.error('pipeline load failed after retries', e);
    showToast('求职明细加载失败，请检查网络后刷新重试');
  }
  try{
    const val3 = await kvGetWithRetry(DAILY_KEY);
    if(val3){ dailyLog = val3; }
  }catch(e){
    dailyLoadFailed = true;
    console.error('daily log load failed after retries', e);
    showToast('打卡记录加载失败，请检查网络后刷新重试');
  }
  render();
  renderPipeline();
  renderDaily();
  renderDashboard();
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function trySave(key, dataObj, label){
  for(let attempt=0; attempt<3; attempt++){
    try{
      const ok = await kvSet(key, dataObj);
      if(ok === 'conflict'){
        // 不重试、不覆盖：刷新会拿到云端最新版本，本页这次的改动不会保存
        showToast('云端数据已在其他设备/标签页更新，这次修改没有保存，请刷新页面后再改');
        return false;
      }
      if(ok) return true;
    }catch(e){
      console.error(label+' save attempt '+(attempt+1)+' failed', e);
    }
    if(attempt<2) await sleep(600);
  }
  showToast('保存失败，请检查网络后重试');
  return false;
}

async function saveState(){
  // 主看板没加载成功时内存里是空的默认 state，保存会把云端整份看板覆盖成空壳
  if(stateLoadFailed){ showToast('看板还没加载成功，暂不保存，请先刷新页面'); return false; }
  return trySave(STORAGE_KEY, state, 'kanban');
}
async function savePipeline(){

}
async function saveDaily(date){
  if(dailyLoadFailed){ showToast('打卡记录还没加载成功，暂不保存，请先刷新页面'); return false; }
  const ok = await trySave(DAILY_KEY, dailyLog, 'daily');
  if(ok) syncDailyLogToSheet(date || todayStr(0)); // 不阻塞、不影响主流程；同步失败只在控制台报错，不打扰使用
  return ok;
}

// 把"今天"这一条打卡记录同步到 Google Sheet，任务ID换成可读的任务标题。
// 走同源的 /api/kanban/sync 代理（真正的 Apps Script URL/密钥只在 Cloudflare 那一侧），
// 用 keepalive 发送：页面切走/关闭也不会中断这次请求，不阻塞主流程。
function syncDailyLogToSheet(date){
  const entry = dailyLog.entries[date];
  if(!entry) return;
  const hoursByTitle = {};
  Object.keys(entry.hours).forEach(taskId => {
    const task = state.tasks.find(t => t.id === taskId);
    const label = task ? task.title : taskId;
    if(entry.hours[taskId] > 0) hoursByTitle[label] = entry.hours[taskId];
  });
  const payload = {
    date: date,
    hours: hoursByTitle,
    note: entry.note || '',
    syncedAt: new Date().toISOString()
  };
  fetch(KANBAN_SYNC_PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    keepalive: true
  }).catch(e => console.error('daily log sheet sync failed', e));
}

function fmtDate(ts){

  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  document.getElementById('board').innerHTML = Object.keys(LIFECYCLE).map(lc => {
    const list = state.tasks.filter(p => lifecycleOf(p) === lc);
    return `<div class="col">
      <div class="col-head"><span class="dot ${LIFECYCLE[lc]}"></span><span class="col-title">${t(LC_LABEL[lc])}</span><span class="col-count">${list.length ? `(${list.length})` : ''}</span></div>
      <p class="col-desc">${t(LC_LABEL[lc] + 'Desc')}</p>
      ${list.length ? list.map(cardHtml).join('') : `<div class="empty">${t('emptyNone')}</div>`}
    </div>`;
  }).join('');
  renderTasks(); renderPipeline();
  document.getElementById('lastCheckin').textContent = state.lastCheckin
    ? `${t('lastCheckinPrefix')}${fmtDate(state.lastCheckin)}` : t('neverCheckedIn');
}

// Project lifecycle: `column` stays the source of truth (other views and old builds read it);
// `phase` only refines it, and is ignored once it no longer matches the column.
const LIFECYCLE = { exploring:'active', active:'active', maintaining:'watch', on_hold:'watch', archived:'archived' };
const LC_LABEL = { exploring:'lcExploring', active:'lcActive', on_hold:'lcOnHold', maintaining:'lcMaintaining', archived:'lcArchived' };
function lifecycleOf(p){
  if(p.phase && LIFECYCLE[p.phase] === p.column) return p.phase;
  return { active:'active', watch:'on_hold', archived:'archived' }[p.column];
}
async function setLifecycle(id, lc){
  const p = state.tasks.find(x => x.id === id);
  if(!p || !LIFECYCLE[lc]) return;
  p.column = LIFECYCLE[lc];
  if(lc === 'exploring' || lc === 'maintaining') p.phase = lc; else delete p.phase;
  p.updatedAt = Date.now();
  await saveState(); render(); renderDaily(); renderDashboard(); showToast(t('toastUpdated'));
}

const TASK_STATUS = ['inbox','backlog','ready','doing','waiting','done'];
const TS_LABEL = { inbox:'tsInbox', backlog:'tsBacklog', ready:'tsReady', doing:'tsDoing', waiting:'tsWaiting', done:'tsDone' };
const openProjects = new Set(); // keeps a project's task list expanded across re-renders
function taskRowHtml(it){
  return `<div class="task-row ${it.status}">
      <select class="stage-select" onchange="setTaskStatus('${it.id}',this.value)">${TASK_STATUS.map(s => `<option value="${s}" ${s===it.status?'selected':''}>${t(TS_LABEL[s])}</option>`).join('')}</select>
      <span>${escapeHtml(it.title)}</span>
      <button class="chip" onclick="deleteItem('${it.id}')" aria-label="${t('chipDelete')}">×</button>
    </div>`;
}
function tasksHtml(p){
  const items = state.items.filter(x => x.projectId === p.id)
    .sort((a,b) => TASK_STATUS.indexOf(a.status) - TASK_STATUS.indexOf(b.status));
  const open = items.filter(x => x.status !== 'done').length;
  const rows = items.map(taskRowHtml).join('');
  return `<details class="card-tasks" ${openProjects.has(p.id)?'open':''} ontoggle="this.open ? openProjects.add('${p.id}') : openProjects.delete('${p.id}')">
      <summary>${t('tasksSummary')} (${open}/${items.length})</summary>
      ${rows}
      <form class="task-add" onsubmit="addItem(event,'${p.id}')">
        <input name="title" placeholder="${t('placeholderNewTask')}" aria-label="${t('placeholderNewTask')}">
        <button class="chip">${t('btnAdd')}</button>
      </form>
    </details>`;
}
async function addItem(e, projectId, applicationId){
  e.preventDefault();
  const title = e.target.elements.title.value.trim(); // form.title is the attribute, not the input
  projectId = projectId || e.target.elements.project.value; // tasks tab picks the project in the form
  if(!title || !state.tasks.some(p => p.id === projectId)) return;
  const item = { id: uid(), projectId, title, status: 'inbox', updatedAt: Date.now() };
  if(applicationId) item.applicationId = applicationId; // Application lives in the pipeline doc; the link is kept on the task
  state.items.push(item);
  e.target.elements.title.value = '';
  openProjects.add(projectId);
  await saveState(); render(); showToast(t('toastAdded'));
}
let taskFilter = '';
function taskTotalHours(taskId){ return Object.values(dailyLog.entries).reduce((sum, e) => sum + taskHoursOf(e, taskId), 0); }
function taskLogHtml(it){
  const p = state.tasks.find(x => x.id === it.projectId);
  const today = taskHoursOf(getEntryIfAny(todayStr(0)), it.id), total = taskTotalHours(it.id);
  const btns = p && canLogProject(p) ? `<button class="chip btn-sm" onclick="logHours('${p.id}','${it.id}',0.5,todayStr(0))">+0.5h</button>
      <button class="chip btn-sm" onclick="logHours('${p.id}','${it.id}',1,todayStr(0))">+1h</button>` : '';
  return `<div class="card-actions" style="margin-bottom:6px;">${btns}<span class="sub" style="font-size:11.5px;">${t('todayShort')} ${today}h · ${t('totalShort')} ${total}h</span></div>`;
}
function goTasks(projectId){
  taskFilter = projectId; switchTab('tasks'); renderTasks();
  document.getElementById('taskAddTitle').focus();
}
function renderTasks(){
  const live = state.tasks.filter(p => p.column !== 'archived');
  const opt = (p, sel) => `<option value="${p.id}" ${p.id===sel?'selected':''}>${escapeHtml(p.title)}${p.column==='archived' ? t('tagArchived') : ''}</option>`;
  if(taskFilter && !state.tasks.some(p => p.id === taskFilter)) taskFilter = '';
  document.getElementById('taskFilter').innerHTML = `<option value="">${t('allProjects')}</option>` + state.tasks.map(p => opt(p, taskFilter)).join('');
  const addSel = document.getElementById('taskAddProject');
  addSel.innerHTML = live.map(p => opt(p, taskFilter || addSel.value)).join('');
  document.getElementById('taskAddTitle').placeholder = t('placeholderNewTask');
  document.getElementById('taskAddBtn').textContent = t('btnAdd');
  const items = state.items.filter(x => !taskFilter || x.projectId === taskFilter);
  const title = id => (state.tasks.find(p => p.id === id) || {}).title || '';
  document.getElementById('taskBoard').innerHTML = TASK_STATUS.map(st => {
    const list = items.filter(x => x.status === st);
    return `<div class="col">
      <div class="col-head"><span class="col-title">${t(TS_LABEL[st])}</span><span class="col-count">${list.length ? `(${list.length})` : ''}</span></div>
      ${list.length ? list.map(it => `<div class="card ${st==='done'?'archived':'active'}">
          <p class="card-title">${escapeHtml(it.title)}</p>
          <p class="task-project">${escapeHtml(title(it.projectId))}${appName(it.applicationId) ? ` · ${escapeHtml(appName(it.applicationId))}` : ''}</p>
          ${taskLogHtml(it)}
          <div class="card-actions">
            <select class="stage-select" onchange="setTaskStatus('${it.id}',this.value)">${TASK_STATUS.map(s => `<option value="${s}" ${s===it.status?'selected':''}>${t(TS_LABEL[s])}</option>`).join('')}</select>
            <button class="chip" onclick="deleteItem('${it.id}')">${t('chipDelete')}</button>
          </div>
        </div>`).join('') : `<div class="empty">${t('emptyNone')}</div>`}
    </div>`;
  }).join('');
}
async function setTaskStatus(id, status){
  const it = state.items.find(x => x.id === id);
  if(!it || !TASK_STATUS.includes(status)) return;
  it.status = status; it.updatedAt = Date.now();
  await saveState(); render(); showToast(t('toastUpdated'));
}
async function deleteItem(id){
  state.items = state.items.filter(x => x.id !== id);
  await saveState(); render(); showToast(t('toastDeleted'));
}

function cardHtml(task){
  const actions = [];
  const lc = lifecycleOf(task);
  actions.push(`<select class="stage-select" onchange="setLifecycle('${task.id}',this.value)">${Object.keys(LIFECYCLE).map(k => `<option value="${k}" ${k===lc?'selected':''}>${t(LC_LABEL[k])}</option>`).join('')}</select>`);
  actions.push(`<button class="chip" onclick="editTask('${task.id}')">${t('chipEdit')}</button>`);
  actions.push(`<button class="chip" onclick="deleteTask('${task.id}')">${t('chipDelete')}</button>`);
  return `<div class="card ${task.column}">
      <p class="card-title">${escapeHtml(task.title)}</p>
      ${task.notes ? `<p class="card-notes">${escapeHtml(task.notes)}</p>` : ''}
      <p class="card-meta">${t('metaUpdatedPrefix')}${fmtDate(task.updatedAt)}</p>
      ${tasksHtml(task)}
      <div class="card-actions">${actions.join('')}</div>
    </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function deleteTask(id){
  state.tasks = state.tasks.filter(x => x.id !== id);
  state.items = state.items.filter(x => x.projectId !== id);
  await saveState(); render(); renderDaily(); showToast(t('toastDeleted'));
}
let editingTaskId = null;
function toggleAddForm(){
  const el = document.getElementById('addForm');
  if(el.classList.contains('show')){
    el.classList.remove('show'); editingTaskId = null;
  } else {
    editingTaskId = null;
    document.getElementById('newTitle').value = ''; document.getElementById('newNotes').value = '';
    document.getElementById('addFormTitle').textContent = t('formTitleAdd');
    el.classList.add('show');
  }
}
function editTask(id){
  const task = state.tasks.find(x => x.id === id);
  if(!task) return;
  editingTaskId = id;
  document.getElementById('newTitle').value = task.title;
  document.getElementById('newNotes').value = task.notes || '';
  document.getElementById('addFormTitle').textContent = t('formTitleEdit');
  document.getElementById('addForm').classList.add('show');
  document.getElementById('addForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function addTask(){
  const title = document.getElementById('newTitle').value.trim();
  const notes = document.getElementById('newNotes').value.trim();
  if(!title){ showToast(t('toastNeedThreadName')); return; }
  if(editingTaskId){
    const task = state.tasks.find(x => x.id === editingTaskId);
    if(task){ task.title = title; task.notes = notes; task.updatedAt = Date.now(); }
    editingTaskId = null;
  } else {
    state.tasks.push({ id: uid(), title, notes, column: 'active', updatedAt: Date.now() });
  }
  document.getElementById('newTitle').value = ''; document.getElementById('newNotes').value = '';
  document.getElementById('addForm').classList.remove('show');
  await saveState(); render(); renderDaily(); showToast(t('toastSaved'));
}

function checkinProgressText(i, n){
  return LANG === 'zh' ? `第 ${i} / ${n} 条` : `Item ${i} of ${n}`;
}

function startCheckin(){
  checkinQueue = state.tasks.filter(task => task.column !== 'archived');
  checkinIndex = 0;
  if(checkinQueue.length === 0){ showToast(t('toastNoThreadsToCheck')); return; }
  document.getElementById('overlay').classList.add('show');
  showCheckinCard();
}
function showCheckinCard(){
  const task = checkinQueue[checkinIndex];
  document.getElementById('ciProgress').textContent = checkinProgressText(checkinIndex+1, checkinQueue.length);
  document.getElementById('ciTitle').textContent = task.title;
  document.getElementById('ciNotes').textContent = task.notes || '';
  document.getElementById('ciNote').value = '';
}
async function ciAction(col){
  const task = checkinQueue[checkinIndex];
  const note = document.getElementById('ciNote').value.trim();
  const target = state.tasks.find(x => x.id === task.id);
  if(target){
    target.column = col; target.updatedAt = Date.now();
    if(note){ target.notes = (target.notes ? target.notes + '\n' : '') + note; }
  }
  await saveState(); advanceCheckin();
}
function ciSkip(){ advanceCheckin(); }
async function advanceCheckin(){
  checkinIndex++;
  if(checkinIndex >= checkinQueue.length){
    document.getElementById('overlay').classList.remove('show');
    state.lastCheckin = Date.now(); await saveState(); render();
    showToast(t('toastCheckinDone')); return;
  }
  render(); showCheckinCard();
}

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

function stageLabel(s){ return t('stage' + s.charAt(0).toUpperCase() + s.slice(1)); }
const stageClass = {
  applied:'stage-applied', screen:'stage-screen', interview:'stage-interview', final:'stage-final',
  offer:'stage-offer', rejected:'stage-rejected', contacted:'stage-contacted', replied:'stage-replied',
  meeting:'stage-meeting', noresponse:'stage-noresponse'
};
const companyStageOptions = ['applied','screen','interview','final','offer','rejected'];
const contactStageOptions = ['contacted','replied','meeting','noresponse'];

async function addCompany(){
  const name = document.getElementById('coName').value.trim();
  const stage = document.getElementById('coStage').value;
  const notes = document.getElementById('coNotes').value.trim();
  if(!name){ showToast(t('toastNeedCompanyName')); return; }
  pipeline.companies.push({ id: uid(), name, stage, notes, updatedAt: Date.now() });
  document.getElementById('coName').value=''; document.getElementById('coNotes').value='';
  toggleForm('companyForm'); await savePipeline(); renderPipeline(); renderDashboard(); showToast(t('toastAdded'));
}
async function addContact(){
  const name = document.getElementById('ctName').value.trim();
  const stage = document.getElementById('ctStage').value;
  const notes = document.getElementById('ctNotes').value.trim();
  if(!name){ showToast(t('toastNeedContactInfo')); return; }
  pipeline.contacts.push({ id: uid(), name, stage, notes, updatedAt: Date.now() });
  document.getElementById('ctName').value=''; document.getElementById('ctNotes').value='';
  toggleForm('contactForm'); await savePipeline(); renderPipeline(); showToast(t('toastAdded'));
}
async function updateStage(kind, id, newStage){
  const list = kind === 'company' ? pipeline.companies : pipeline.contacts;
  const item = list.find(x => x.id === id);
  if(item){ item.stage = newStage; item.updatedAt = Date.now(); await savePipeline(); renderPipeline(); renderDashboard(); showToast(t('toastUpdated')); }
}
async function deletePipelineItem(kind, id){
  if(kind === 'company'){ pipeline.companies = pipeline.companies.filter(x => x.id !== id); }
  else { pipeline.contacts = pipeline.contacts.filter(x => x.id !== id); }
  await savePipeline(); renderPipeline(); renderDashboard(); showToast(t('toastDeleted'));
}
function pipelineCardHtml(item, kind, options){
  const opts = options.map(s => `<option value="${s}" ${s===item.stage?'selected':''}>${stageLabel(s)}</option>`).join('');
  return `<div class="card active">
    <span class="stage-badge ${stageClass[item.stage]}">${stageLabel(item.stage)}</span>
    <p class="card-title">${escapeHtml(item.name)}</p>
    ${item.notes ? `<p class="card-notes">${escapeHtml(item.notes)}</p>` : ''}
    <p class="card-meta">${t('metaUpdatedPrefix')}${fmtDate(item.updatedAt)}</p>
    ${kind === 'company' ? appTasksHtml(item) : ''}
    <div class="card-actions">
      <select class="stage-select" onchange="updateStage('${kind}','${item.id}',this.value)">${opts}</select>
      <button class="chip" onclick="deletePipelineItem('${kind}','${item.id}')">${t('chipDelete')}</button>
    </div>
  </div>`;
}
function appName(id){ return id ? (pipeline.companies.find(a => a.id === id) || {}).name || '' : ''; }
const openApps = new Set();
// An Application (pipeline.companies entry) links to one Project and many Tasks (task.applicationId).
function appTasksHtml(app){
  const proj = state.tasks.find(p => p.id === app.projectId);
  const items = state.items.filter(x => x.applicationId === app.id)
    .sort((a,b) => TASK_STATUS.indexOf(a.status) - TASK_STATUS.indexOf(b.status));
  const open = items.filter(x => x.status !== 'done').length;
  const projSel = `<select class="stage-select" onchange="setAppProject('${app.id}',this.value)" aria-label="Project">
      <option value="">${t('appNoProject')}</option>
      ${state.tasks.filter(p => p.column !== 'archived' || p.id === app.projectId).map(p => `<option value="${p.id}" ${p.id===app.projectId?'selected':''}>${escapeHtml(p.title)}</option>`).join('')}
    </select>`;
  return `<details class="card-tasks" ${openApps.has(app.id)?'open':''} ontoggle="this.open ? openApps.add('${app.id}') : openApps.delete('${app.id}')">
      <summary>${t('tasksSummary')} (${open}/${items.length})${proj ? ` · ${escapeHtml(proj.title)}` : ''}</summary>
      <div class="card-actions" style="margin:6px 0;">${projSel}</div>
      ${items.map(taskRowHtml).join('')}
      ${proj ? `<form class="task-add" onsubmit="addItem(event,'${proj.id}','${app.id}')">
        <input name="title" placeholder="${t('placeholderNewTask')}" aria-label="${t('placeholderNewTask')}">
        <button class="chip">${t('btnAdd')}</button>
      </form>` : `<p class="sub" style="font-size:12px;">${t('appPickProject')}</p>`}
    </details>`;
}
async function setAppProject(id, projectId){
  const app = pipeline.companies.find(a => a.id === id);
  if(!app) return;
  app.projectId = projectId || undefined; app.updatedAt = Date.now();
  openApps.add(id);
  await savePipeline(); renderPipeline(); showToast(t('toastUpdated'));
}
function renderPipeline(){
  renderFunnel();
  const coList = document.getElementById('list-companies');
  coList.innerHTML = pipeline.companies.length
    ? pipeline.companies.map(c => pipelineCardHtml(c,'company',companyStageOptions)).join('')
    : `<div class="empty">${t('emptyNone')}</div>`;
  const ctList = document.getElementById('list-contacts');
  ctList.innerHTML = pipeline.contacts.length
    ? pipeline.contacts.map(c => pipelineCardHtml(c,'contact',contactStageOptions)).join('')
    : `<div class="empty">${t('emptyNone')}</div>`;
}

/* ---- Daily log ---- */
let selectedDailyDate = null; // 惰性初始化成今天，避免在 todayStr 定义之前就调用它
function getEntryIfAny(date){ return dailyLog.entries[date] || { hours: {} }; } // read-only: doesn't create a day
function getEntry(date){
  if(!dailyLog.entries[date]) dailyLog.entries[date] = { hours: {}, note: '' };
  return dailyLog.entries[date];
}
function changeDailyDate(date){
  if(!date) return;
  selectedDailyDate = date;
  document.getElementById('dailyDatePicker').value = date;
  renderDaily();
}
// Hours stay per project in entry.hours (history, Sheet sync and project charts read it);
// entry.taskHours says which task that time went to. Logging on a task moves both by the same delta,
// so a project's hours = its tasks' hours + whatever was logged without a task ("unassigned").
function canLogProject(p){ return ['exploring','active','maintaining'].includes(lifecycleOf(p)); }
function taskHoursOf(entry, taskId){ return (entry.taskHours && entry.taskHours[taskId]) || 0; }
function unassignedHours(entry, projectId){
  const onTasks = state.items.filter(x => x.projectId === projectId).reduce((sum, x) => sum + taskHoursOf(entry, x.id), 0);
  return Math.max(0, (entry.hours[projectId] || 0) - onTasks);
}
async function logHours(projectId, taskId, amount, date){
  date = date || selectedDailyDate || todayStr(0);
  const entry = getEntry(date);
  let delta;
  if(taskId){
    entry.taskHours = entry.taskHours || {};
    const cur = taskHoursOf(entry, taskId);
    delta = Math.max(0, cur + amount) - cur;
    entry.taskHours[taskId] = cur + delta;
  } else {
    delta = Math.max(-unassignedHours(entry, projectId), amount);
  }
  entry.hours[projectId] = Math.max(0, (entry.hours[projectId] || 0) + delta);
  await saveDaily(date);
  renderDaily(); renderTasks();
}
async function saveDailyNote(){
  const date = selectedDailyDate || todayStr(0);
  const entry = getEntry(date);
  entry.note = document.getElementById('dailyNoteInput').value.trim();
  await saveDaily(date);
}
const CLEAR_LABEL = { zh: '清零', en: 'Clear' };
function renderDaily(){
  if(!selectedDailyDate) selectedDailyDate = todayStr(0);
  const date = selectedDailyDate;
  const entry = getEntry(date);
  const picker = document.getElementById('dailyDatePicker');
  picker.max = todayStr(0); // 不能补未来的卡
  if(picker.value !== date) picker.value = date;
  const isToday = date === todayStr(0);
  document.getElementById('dailyDateLabel').textContent = isToday ? `📅 ${date}` : `📅 补打卡：${date}`;
  const projects = state.tasks.filter(p => canLogProject(p) || (entry.hours[p.id] || 0) > 0);
  const btns = (pid, tid, h) => `<div class="log-btns">
      <button class="chip btn-sm" onclick="logHours('${pid}',${tid ? `'${tid}'` : 'null'},0.5)">+0.5h</button>
      <button class="chip btn-sm" onclick="logHours('${pid}',${tid ? `'${tid}'` : 'null'},1)">+1h</button>
      <button class="chip btn-sm" onclick="logHours('${pid}',${tid ? `'${tid}'` : 'null'},2)">+2h</button>
      ${h > 0 ? `<button class="chip btn-sm" onclick="logHours('${pid}',${tid ? `'${tid}'` : 'null'},-${h})">${CLEAR_LABEL[LANG]}</button>` : ''}
    </div>`;
  const row = (label, sub, h, buttons) => `<div class="log-task">
      <div class="log-task-name">${label}${sub ? ` <span class="sub" style="font-size:11.5px;">${sub}</span>` : ''}</div>
      <span class="log-today-total">${h > 0 ? h + 'h' : ''}</span>${buttons}
    </div>`;
  const listEl = document.getElementById('list-dailylog');
  listEl.innerHTML = projects.length ? projects.map(p => {
    const total = entry.hours[p.id] || 0;
    const canLog = canLogProject(p);
    const tasks = state.items.filter(x => x.projectId === p.id && (x.status !== 'done' || taskHoursOf(entry, x.id) > 0));
    const un = unassignedHours(entry, p.id);
    const tag = canLog ? '' : ` <span class="sub" style="font-weight:400; font-size:11.5px;">${p.column === 'archived' ? t('tagArchived') : t('tagWatch')}</span>`;
    return `<div class="log-row">
      <div class="log-row-title"><span>${escapeHtml(p.title)}${tag}</span><span class="log-today-total">${total > 0 ? total + 'h' : ''}</span></div>
      ${tasks.map(x => row(escapeHtml(x.title), t(TS_LABEL[x.status]), taskHoursOf(entry, x.id), canLog ? btns(p.id, x.id, taskHoursOf(entry, x.id)) : '')).join('')}
      ${canLog || un > 0 ? row(`<span class="sub">${t('logUnassigned')}</span>`, '', un, canLog ? btns(p.id, null, un) : '') : ''}
    </div>`;
  }).join('') : `<div class="empty">${t('dailyEmptyActive')}</div>`;
  document.getElementById('dailyNoteInput').value = entry.note || '';
}


/* ---- Dashboard ---- */
function last7Days(){
  const days = [];
  for(let i=6;i>=0;i--) days.push(todayStr(-i));
  return days;
}
function sumHoursForTask(taskId, days){
  let sum = 0;
  days.forEach(d => { const e = dailyLog.entries[d]; if(e && e.hours[taskId]) sum += e.hours[taskId]; });
  return sum;
}
function allTimeHoursForTask(taskId){
  let sum = 0;
  Object.keys(dailyLog.entries).forEach(d => { const e = dailyLog.entries[d]; if(e.hours[taskId]) sum += e.hours[taskId]; });
  return sum;
}
function lastActiveDate(taskId){
  let latest = null;
  Object.keys(dailyLog.entries).forEach(d => {
    const e = dailyLog.entries[d];
    if(e.hours[taskId] && e.hours[taskId] > 0){ if(!latest || d > latest) latest = d; }
  });
  return latest;
}
function daysBetween(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date(todayStr(0) + 'T00:00:00');
  return Math.round((target - now) / 86400000);
}
